<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบบันทึกการผลิต</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0E7C86">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ระบบบันทึกการผลิต">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; display: flex; align-items: center; justify-content: center;
      background: #0E7C86; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff;
    }
    .wrap { text-align: center; padding: 24px; max-width: 320px; }
    img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    p { font-size: 13.5px; opacity: 0.85; line-height: 1.5; }
    .enter-btn {
      display: inline-block; margin-top: 20px; background: #fff; color: #0B5D66;
      padding: 13px 28px; border-radius: 10px; font-weight: 600; font-size: 14.5px;
      text-decoration: none; border: none; cursor: pointer;
    }
    .hint { margin-top: 22px; font-size: 12px; opacity: 0.7; border-top: 1px solid rgba(255,255,255,0.25); padding-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="icon-512.png" alt="ระบบบันทึกการผลิต">
    <h1>ระบบบันทึกการผลิต</h1>
    <p id="statusText">กำลังเข้าสู่ระบบใน <span id="countdown">3</span> วินาที...</p>
    <a class="enter-btn" href="https://script.google.com/macros/s/AKfycbzEYEUzYYqq7BLdZ2nm7n_EiboQUXM6jpk9zvXOjIVqJ0f6uHX6AmakvJUfPEvr9G-T/exec" id="enterBtn">เข้าใช้งานตอนนี้</a>
    <p class="hint">
      💡 หากต้องการเพิ่มไอคอนนี้ไปยังหน้าจอโฮม ให้กดเมนู ⋮ ของเบราว์เซอร์ตอนนี้ (ก่อนที่ระบบจะเด้งเข้าแอปอัตโนมัติ) แล้วเลือก "เพิ่มไปยังหน้าจอโฮม" หรือ "ติดตั้งแอป"
    </p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }

    var seconds = 3;
    var countdownEl = document.getElementById('countdown');
    var timer = setInterval(function() {
      seconds--;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "https://script.google.com/macros/s/AKfycbzEYEUzYYqq7BLdZ2nm7n_EiboQUXM6jpk9zvXOjIVqJ0f6uHX6AmakvJUfPEvr9G-T/exec";
      } else {
        countdownEl.textContent = seconds;
      }
    }, 1000);
  </script>
</body>
</html>
